# ---------------------------------------------------------------------------
# prefix
# ---------------------------------------------------------------------------
# Ctrl-a instead of the default Ctrl-b: Ctrl-b is vim's page-up in normal mode,
# and the multiplexer swallows the key before nvim ever sees it.
set -g prefix C-a
unbind C-b
# prefix twice sends a literal Ctrl-a through (shell's beginning-of-line)
bind C-a send-prefix

# ---------------------------------------------------------------------------
# behaviour needed by neovim
# ---------------------------------------------------------------------------
# Default escape-time is 500ms, which makes Esc feel laggy in nvim -- tmux
# waits that long to see if it's the start of an escape sequence.
set -sg escape-time 10
# lets nvim's :autoread notice files changed outside the editor
set -g focus-events on
# truecolor passthrough, or nvim's theme renders as 256-colour approximations
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-ghostty:RGB"

# windows numbered from 1 so prefix+1 hits the first one, not prefix+0
set -g base-index 1
setw -g pane-base-index 1
# keep numbering contiguous after closing a window
set -g renumber-windows on

set -g mouse on
set -g history-limit 50000

# ---------------------------------------------------------------------------
# copy-mode -- vim-style browsing/selecting/copying in scrollback, no
# trackpad needed. prefix [ enters it, q or Esc leaves without copying.
# ---------------------------------------------------------------------------
set -g mode-keys vi

# h/j/k/l, w/b/e, Ctrl-d/Ctrl-u, g/G, /, {} all already match vim by
# default once mode-keys is vi -- nothing to add there. V and Ctrl-v also
# already match vim's V (line-wise) and Ctrl-v (block-wise) visual modes.
# Only plain `v` doesn't by default (tmux uses it for rectangle-toggle,
# which Ctrl-v already covers) -- remapped here to complete the v/V/C-v
# parity with real vim.
bind -T copy-mode-vi v send-keys -X begin-selection

# Finishing a selection (Enter, or the vim-muscle-memory y, or a mouse
# drag) pipes it to pbcopy so it lands on the real macOS clipboard --
# tmux's own default only saves it to tmux's internal buffer, which
# nothing outside tmux can paste from.
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi y     send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# ---------------------------------------------------------------------------
# status bar -- minimal, tokyonight colours
# ---------------------------------------------------------------------------
set -g status-position bottom
set -g status-style "bg=#1a1b26,fg=#565f89"

set -g status-left "[#S] "
set -g status-left-length 20
set -g status-left-style "fg=#7aa2f7,bold"

# nothing on the right: no clock, no hostname, no pane title
set -g status-right ""

# "1:nvim  2:zsh" -- current window brighter and bold, inactive dimmed
setw -g window-status-format "#I:#W "
setw -g window-status-style "fg=#565f89"
setw -g window-status-current-format "#I:#W "
setw -g window-status-current-style "fg=#c0caf5,bold"
setw -g window-status-separator " "
