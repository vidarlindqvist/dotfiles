# --- Spanned wallpaper (one image across both monitors) ---
# hyprpaper has no native "span" mode -- each monitor is its own
# layer-shell surface, so this is one big image pre-sliced into two
# per-monitor pieces that line up with the real layout from
# hyprland.lua (DP-6 at 0,0; DP-5 at 2560,-1120, rotated). See
# ~/dev/dotfiles/wallpaper/tokyonight_span_canvas.png for the full
# 4000x2560 source these were cropped from -- regenerate the slices
# from that if the monitor layout ever changes.
wallpaper {
    monitor = DP-6
    path = /home/vidar/dev/dotfiles/wallpaper/tokyonight_span_dp6.png
    fit_mode = fill
}

wallpaper {
    monitor = DP-5
    path = /home/vidar/dev/dotfiles/wallpaper/tokyonight_span_dp5.png
    fit_mode = fill
}

splash = false
ipc = on
