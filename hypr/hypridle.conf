# hypridle -- see https://wiki.hyprland.org/Hypr-Ecosystem/hypridle
# Desktop machine, no laptop backlight/keyboard-backlight listeners needed.

general {
    # Autolock + lockscreen disabled entirely -- home desktop, someone would
    # need to already be inside the apartment to touch it, and the idle-lock
    # was just an annoyance on bathroom breaks etc. Code below (lock_cmd,
    # before_sleep_cmd, and the two listeners that drove it) kept in place
    # commented out rather than deleted -- lock.sh, quickshell-lock/*.qml,
    # and the /etc/pam.d/quickshell-lock config are all still intact, so
    # this is a one-line-uncomment (plus the keybind in hyprland.lua) to
    # bring it back.
    # lock_cmd = /home/vidar/dev/dotfiles/quickshell-lock/lock.sh
    # before_sleep_cmd = loginctl lock-session                           # lock before suspend
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'  # turn screen on w/o keypress after resume
}

# listener {
#     timeout = 570                                                              # 9.5min, 30s warning before lock
#     on-timeout = notify-send -u critical -t 30000 "Locking soon" "Screen locks in 30 seconds -- move the mouse to cancel"
# }
#
# listener {
#     timeout = 600                                  # 10min
#     on-timeout = loginctl lock-session              # lock screen
# }

listener {
    timeout = 630                                                    # 10.5min, shortly after lock
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'    # screen off
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'      # screen on when activity resumes
}

# Auto-suspend after 30min idle. Remove this listener if you'd rather the
# desktop never sleeps on its own (e.g. background downloads, game
# servers, remote access).
listener {
    timeout = 1800                                 # 30min
    on-timeout = systemctl suspend
}
