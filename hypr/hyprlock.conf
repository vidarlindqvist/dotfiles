# hyprlock -- see https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock
# Tokyonight (Night variant), matching the rest of the rice:
#   bg #1a1b26, fg #c0caf5, comment #565f89, border #414868
#   blue #7aa2f7, green #9ece6a, red #f7768e

$font = JetBrainsMono Nerd Font

general {
    hide_cursor = false
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = /home/vidar/dev/dotfiles/wallpaper/tokyonight_wallpaper.png
    color = rgb(26, 27, 38)
    blur_passes = 3
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 3
    inner_color = rgba(26, 27, 38, 0.8)

    outer_color = rgb(122, 162, 247)      # blue, idle
    check_color = rgb(158, 206, 106)      # green, checking
    fail_color = rgb(247, 118, 142)       # red, failed

    font_color = rgb(192, 202, 245)       # fg
    fade_on_empty = false
    rounding = 0                          # sharp corners, matching hyprland.lua

    font_family = $font
    placeholder_text = Enter password...
    fail_text = Wrong password

    dots_spacing = 0.3

    position = 0, -20
    halign = center
    valign = center
}

# TIME
label {
    monitor =
    text = $TIME
    color = rgb(192, 202, 245)
    font_size = 90
    font_family = $font

    position = -30, 0
    halign = right
    valign = top
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    color = rgb(86, 95, 137)
    font_size = 25
    font_family = $font

    position = -30, -150
    halign = right
    valign = top
}
