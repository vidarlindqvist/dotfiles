"$schema" = 'https://starship.rs/config-schema.json'

# Tokyonight (Night variant) -- same palette as ghostty/tmux/GTK/dunst/Zen:
# bg #1a1b26, bg_dark #16161e, bg_highlight #292e42, fg #c0caf5,
# comment #565f89, blue #7aa2f7, cyan #7dcfff, green #9ece6a,
# magenta #bb9af7, red #f7768e, yellow #e0af68

format = """
$directory\
$git_branch\
$git_status\
$nodejs\
$python\
$rust\
$golang\
$lua\
$typst\
$fill\
$cmd_duration
$character"""

[fill]
symbol = ' '

[character]
success_symbol = '[❯](bold #7aa2f7)'
error_symbol = '[❯](bold #f7768e)'
vimcmd_symbol = '[❮](bold #9ece6a)'

[directory]
style = 'bold #7aa2f7'
truncation_length = 4
truncate_to_repo = true
read_only = ' 󰌾'

[git_branch]
style = 'bold #bb9af7'
format = '[on](#565f89) [$symbol$branch]($style) '

[git_status]
style = '#f7768e'
format = '([\[$all_status$ahead_behind\]]($style)) '

[nodejs]
style = '#9ece6a'
format = '[via](#565f89) [$symbol($version)]($style) '

[python]
style = '#e0af68'
# nf-dev-python (U+E73C) -- the actual Python logo mark, not the default
# snake emoji. $virtualenv only renders when a venv is actually activated
# (VIRTUAL_ENV set), not merely present as a .venv folder on disk -- there's
# no auto-activation hook in zsh/, so `source .venv/bin/activate` first.
symbol = ' '
format = '[via](#565f89) [$symbol($version )(\($virtualenv\) )]($style)'

[rust]
style = '#f7768e'
format = '[via](#565f89) [$symbol($version)]($style) '

[golang]
style = '#7dcfff'
format = '[via](#565f89) [$symbol($version)]($style) '

[lua]
style = '#7aa2f7'
# nf-dev-lua (U+E826) -- the actual Lua logo, not the default moon emoji.
symbol = ' '
format = '[via](#565f89) [$symbol($version)]($style) '

[typst]
style = 'bold #bb9af7'
# nf-linux-typst (U+F37F) -- Typst's own logo mark.
symbol = ' '
format = '[via](#565f89) [$symbol($version )]($style)'

[cmd_duration]
min_time = 2000
style = '#565f89'
format = 'took [$duration]($style) '
