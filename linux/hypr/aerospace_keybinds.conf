# Translation of ~/.aerospace.toml's keybinds to Hyprland.
#
# AeroSpace's modifier was ctrl+cmd+alt, but only because that combo was
# free of macOS collisions -- it's not meaningful on Linux. $mainMod below
# is the real equivalent: a single dedicated modifier, same role.
# `hyprctl` names directions l/r/u/d, not hjkl, so h/j/k/l are bound TO
# those directions below, same as AeroSpace's vim-style layout.

$mainMod = SUPER

# --- focus (AeroSpace: ctrl-cmd-alt-h/j/k/l) ---
bind = $mainMod, h, movefocus, l
bind = $mainMod, j, movefocus, d
bind = $mainMod, k, movefocus, u
bind = $mainMod, l, movefocus, r

# --- move window (AeroSpace: ctrl-cmd-alt-shift-h/j/k/l) ---
bind = $mainMod SHIFT, h, movewindow, l
bind = $mainMod SHIFT, j, movewindow, d
bind = $mainMod SHIFT, k, movewindow, u
bind = $mainMod SHIFT, l, movewindow, r

# --- resize (AeroSpace: ctrl-cmd-alt-minus/equal, "resize smart") ---
# Hyprland has no layout-aware "smart" resize; resizeactive nudges the
# active window by a pixel delta instead. Sign/axis is a matter of taste --
# adjust once you can feel it.
bind = $mainMod, minus, resizeactive, -50 0
bind = $mainMod, equal, resizeactive, 50 0

# --- floating toggle (AeroSpace: service-mode "f") ---
bind = $mainMod, f, togglefloating

# --- workspaces 1-9 (AeroSpace: ctrl-cmd-alt-1..9) ---
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

# --- lettered workspaces (AeroSpace: ctrl-cmd-alt-a..z minus h/j/k/l) ---
# Hyprland supports named workspaces the same way. Trimmed to a few as an
# example -- copy the pattern for the rest of the letters you actually use.
bind = $mainMod, a, workspace, name:A
bind = $mainMod, b, workspace, name:B
bind = $mainMod, c, workspace, name:C
bind = $mainMod SHIFT, a, movetoworkspace, name:A
bind = $mainMod SHIFT, b, movetoworkspace, name:B
bind = $mainMod SHIFT, c, movetoworkspace, name:C

# --- workspace-back-and-forth (AeroSpace: ctrl-cmd-alt-tab) ---
bind = $mainMod, tab, workspace, previous

# --- move workspace to another monitor (AeroSpace: ctrl-cmd-alt-shift-tab) ---
# AeroSpace's "--wrap-around next" cycles monitors; Hyprland wants an
# explicit monitor name here. Fill this in once you know your Linux
# monitor setup (`hyprctl monitors` lists names).
# bind = $mainMod SHIFT, tab, movecurrentworkspacetomonitor, <monitor-name>

# --- layout toggle (AeroSpace: ctrl-cmd-alt-period/comma, tiles vs accordion) ---
# Hyprland's tiling model (dwindle/master) isn't the same as AeroSpace's
# explicit tiles/accordion split -- there's no exact equivalent. Closest
# options, pick what feels right once you're using it day to day:
bind = $mainMod, period, layoutmsg, togglesplit   # dwindle: flip split orientation
bind = $mainMod, comma, fullscreen, 0             # visually closest to "accordion"

# --- service mode (AeroSpace: ctrl-cmd-alt-shift-semicolon) ---
# Hyprland's "submap" is the equivalent of AeroSpace's modal binding mode.
bind = $mainMod SHIFT, semicolon, submap, service

submap = service
# AeroSpace: r = flatten-workspace-tree -- no direct Hyprland equivalent,
# closest is toggling split layout on every window; left as a no-op reminder.
bind = , backspace, killactive
bind = , escape, submap, reset
submap = reset

# --- notes on rules with no clean Hyprland equivalent ---
# - "close-all-windows-but-current": no built-in dispatcher; would need a
#   small script driving `hyprctl clients` + `hyprctl dispatch closewindow`.
# - "join-with" (explicit container joining): dwindle/master don't expose
#   manual container joins the way AeroSpace's i3-style model does.
# - AeroSpace's on-window-detected rule that auto-focuses Python plot
#   windows (the osascript trick) is a macOS-only workaround for a
#   focus-stealing-prevention quirk that doesn't exist the same way on
#   Linux WMs -- Hyprland gives new windows focus by default, so this
#   doesn't need porting at all.
